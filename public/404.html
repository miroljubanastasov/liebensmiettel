<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liebensmittel</title>
    <script>
      // GitHub Pages SPA redirect: rewrite the 404 path into a query string
      // that index.html reads back into history.replaceState.
      // See: https://github.com/rafgraph/spa-github-pages
      (function () {
        var segmentCount = 1; // /liebensmiettel/ → keep one path segment
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
